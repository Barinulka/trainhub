services:
  database:
    image: postgres:${POSTGRES_VERSION:-18.6-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trainhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainhub}
      POSTGRES_USER: ${POSTGRES_USER:-trainhub}
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-trainhub}", "-U", "${POSTGRES_USER:-trainhub}" ]
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 10s
    volumes:
      - database_data:/var/lib/postgresql
    ports:
      - "5433:5432"

volumes:
  database_data:
